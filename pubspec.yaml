name: flutter_variety_chart
description: A pure-Dart, dependency-free chart library for Flutter offering cartesian and circular visualizations such as line, spline, area, column, bar, scatter, pie and doughnut charts.
version: 0.5.11
homepage: https://github.com/ArdWang/flutter_variety_chart
repository: https://github.com/ArdWang/flutter_variety_chart
issue_tracker: https://github.com/ArdWang/flutter_variety_chart/issues

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
